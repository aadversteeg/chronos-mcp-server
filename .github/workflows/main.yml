name: Publish Chronos Mcp Server to Dockerhub

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'  # Only trigger on tags with format like 1.2.3

jobs:
  container-build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build the Docker image
        working-directory: src
        run: |
          # Use the multi-stage Dockerfile which already includes build/test
          docker build -f Core.Infrastructure.McpServer/Dockerfile \
            --build-arg BUILD_CONFIGURATION=Release \
            -t aadversteeg/chronos-mcp-server:${{ steps.get_version.outputs.VERSION }} \
            -t aadversteeg/chronos-mcp-server:latest \
            .

      - name: Log into Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push the image to Docker Hub
        run: |
          docker push aadversteeg/chronos-mcp-server:${{ steps.get_version.outputs.VERSION }}
          docker push aadversteeg/chronos-mcp-server:latest
