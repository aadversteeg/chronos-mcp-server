name: Run Tests and Build Docker Image

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Restore dependencies
      run: dotnet restore src/chronos.sln
    
    - name: Build
      run: dotnet build src/chronos.sln --no-restore
    
    - name: Test
      run: dotnet test src/chronos.sln --no-build --verbosity normal
  
  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      working-directory: src
      run: |
        # Build the image but don't push it
        docker build -f Core.Infrastructure.McpServer/Dockerfile \
          --build-arg BUILD_CONFIGURATION=Release \
          -t chronos-mcp-server:test \
          .
    
    - name: Test Docker image
      run: |
        # Run the container briefly to make sure it starts correctly
        docker run --name test-container -d chronos-mcp-server:test
        # Give it a second to start
        sleep 5
        # Check if it's running
        if ! docker ps | grep test-container; then
          echo "Container failed to start properly"
          docker logs test-container
          exit 1
        fi
        # Clean up
        docker stop test-container
        docker rm test-container
